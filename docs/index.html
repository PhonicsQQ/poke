<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prismatic Evolutions — Price Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAFAF9;
    --ink: #1A1A18;
    --muted: #8A8A85;
    --line: #E7E7E3;
    --tile: #FFFFFF;
    --up: #157F52;
    --down: #C0453E;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Schibsted Grotesk", system-ui, sans-serif;
    padding: 48px 24px 96px;
  }
  .mono { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }
  .up   { color: var(--up); }
  .down { color: var(--down); }
  .muted { color: var(--muted); }

  header {
    max-width: 1120px; margin: 0 auto 8px;
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px 20px;
  }
  header h1 { font-size: clamp(1.5rem, 4vw, 2.2rem); font-weight: 700; letter-spacing: -0.02em; }
  header .meta { font-size: 0.78rem; color: var(--muted); }
  .controls {
    max-width: 1120px; margin: 0 auto 28px;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--line); padding-bottom: 16px;
  }
  .controls label { font-size: 0.78rem; color: var(--muted); }
  .controls select {
    font: inherit; font-size: 0.82rem; color: var(--ink);
    background: var(--tile); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 8px;
  }

  .grid {
    max-width: 1120px; margin: 0 auto;
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  }
  .tile {
    background: var(--tile);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    cursor: pointer;
    text-align: left;
    font: inherit; color: inherit;
    display: flex; flex-direction: column; gap: 8px;
    transition: border-color 0.12s;
  }
  .tile:hover, .tile:focus-visible { border-color: var(--muted); outline: none; }
  .tile img {
    width: 100%; aspect-ratio: 63 / 88; object-fit: contain;
    border-radius: 6px; background: var(--bg);
  }
  .tile .name { font-weight: 700; font-size: 0.92rem; line-height: 1.3; }
  .tile .sub  { font-size: 0.7rem; color: var(--muted); letter-spacing: 0.02em; }
  .tile .prices {
    display: flex; align-items: baseline; justify-content: space-between;
    border-top: 1px solid var(--line); padding-top: 8px; margin-top: auto;
  }
  .tile .now { font-size: 0.95rem; font-weight: 500; }
  .tile .chg { font-size: 0.75rem; }
  .tile .was { font-size: 0.7rem; color: var(--muted); }

  dialog {
    border: 1px solid var(--line); border-radius: 14px;
    background: var(--tile); color: var(--ink);
    padding: 24px; max-width: 720px; width: calc(100% - 40px);
  }
  dialog::backdrop { background: rgba(26, 26, 24, 0.45); }
  .detail { display: grid; grid-template-columns: 200px 1fr; gap: 24px; align-items: start; }
  .detail img { width: 100%; border-radius: 8px; }
  .detail h2 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em; }
  .detail .sub { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
  .detail .stats { display: flex; gap: 24px; margin: 14px 0 6px; }
  .detail .stats .label { font-size: 0.68rem; color: var(--muted); }
  .detail .stats .value { font-size: 1rem; font-weight: 500; }
  .close {
    position: absolute; top: 14px; right: 14px;
    background: none; border: none; cursor: pointer;
    font-size: 1.1rem; color: var(--muted); line-height: 1;
  }
  .chart-title { font-size: 0.7rem; color: var(--muted); margin: 12px 0 4px; }
  @media (max-width: 560px) {
    .detail { grid-template-columns: 1fr; }
    .detail img { max-width: 200px; margin: 0 auto; }
  }

  .empty { max-width: 560px; margin: 80px auto; text-align: center; color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1 id="title">Prismatic Evolutions</h1>
  <span class="meta mono" id="meta"></span>
</header>
<div class="controls">
  <label for="sort">Sort</label>
  <select id="sort">
    <option value="number">Card number</option>
    <option value="price">Price, high to low</option>
    <option value="change">7d change, high to low</option>
    <option value="name">Name, A to Z</option>
  </select>
</div>

<div class="grid" id="grid"></div>
<div class="empty" id="empty" hidden><p>No price data yet — check back after the next daily snapshot.</p></div>

<dialog id="modal">
  <button class="close" id="close" aria-label="Close">✕</button>
  <div class="detail" id="detail"></div>
</dialog>

<script>
const usd = n => n == null ? "—" :
  n.toLocaleString("en-US", { style: "currency", currency: "USD" });

const chg = c => {
  if (c == null) return `<span class="chg muted">—</span>`;
  const cls = c > 0 ? "up" : c < 0 ? "down" : "muted";
  const sign = c > 0 ? "+" : "";
  return `<span class="chg mono ${cls}">${sign}${c.toFixed(1)}%</span>`;
};

function chart(history) {
  const pts = history.filter(p => p.price != null);
  if (pts.length === 0) return `<p class="muted" style="font-size:0.8rem">No price history recorded.</p>`;

  const w = 460, h = 200, m = { top: 12, right: 12, bottom: 26, left: 52 };
  const iw = w - m.left - m.right, ih = h - m.top - m.bottom;
  const prices = pts.map(p => p.price);
  let min = Math.min(...prices), max = Math.max(...prices);
  if (min === max) { min -= min * 0.05 || 1; max += max * 0.05 || 1; }

  const x = i => pts.length === 1 ? m.left + iw / 2
                                  : m.left + i * iw / (pts.length - 1);
  const y = p => m.top + ih - (p - min) / (max - min) * ih;
  const fmtD = d => d.slice(5).replace("-", "/");

  const gridlines = [min, (min + max) / 2, max].map(v => `
    <line x1="${m.left}" y1="${y(v)}" x2="${w - m.right}" y2="${y(v)}"
          stroke="var(--line)" stroke-width="1"/>
    <text x="${m.left - 8}" y="${y(v) + 3}" text-anchor="end"
          font-size="10" fill="var(--muted)" class="mono">${usd(v)}</text>`).join("");

  const line = pts.length > 1
    ? `<polyline fill="none" stroke="var(--ink)" stroke-width="1.5"
         stroke-linejoin="round" stroke-linecap="round"
         points="${pts.map((p, i) => `${x(i).toFixed(1)},${y(p.price).toFixed(1)}`).join(" ")}"/>`
    : "";
  const last = pts[pts.length - 1];
  const dot = `<circle cx="${x(pts.length - 1)}" cy="${y(last.price)}" r="3" fill="var(--ink)"/>`;

  const xlabels = `
    <text x="${m.left}" y="${h - 8}" font-size="10" fill="var(--muted)" class="mono">${fmtD(pts[0].snapshot_date)}</text>
    <text x="${w - m.right}" y="${h - 8}" text-anchor="end" font-size="10" fill="var(--muted)" class="mono">${fmtD(last.snapshot_date)}</text>`;

  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;display:block" role="img"
    aria-label="Price history chart">${gridlines}${line}${dot}${pts.length > 1 ? xlabels : ""}</svg>`;
}

let cards = [];
const modal = document.getElementById("modal");

function openCard(id) {
  const c = cards.find(k => k.card_id === id);
  if (!c) return;
  document.getElementById("detail").innerHTML = `
    <img src="${c.image_url}" alt="${c.name} card">
    <div>
      <h2>${c.name}</h2>
      <div class="sub">${c.rarity ?? "Unknown rarity"} · ${c.set_id} · #${c.number}</div>
      <div class="stats">
        <div><div class="label">Current</div><div class="value mono">${usd(c.current_price)}</div></div>
        <div><div class="label">7 days ago</div><div class="value mono">${usd(c.price_7d_ago)}</div></div>
        <div><div class="label">Change</div><div class="value">${chg(c.pct_change)}</div></div>
      </div>
      <div class="chart-title">Price history</div>
      ${chart(c.history)}
    </div>`;
  modal.showModal();
}

const sorters = {
  number: (a, b) => (parseInt(a.number) || 0) - (parseInt(b.number) || 0),
  price:  (a, b) => (b.current_price ?? -1) - (a.current_price ?? -1),
  change: (a, b) => (b.pct_change ?? -Infinity) - (a.pct_change ?? -Infinity),
  name:   (a, b) => a.name.localeCompare(b.name),
};

function render(sortKey) {
  const grid = document.getElementById("grid");
  grid.innerHTML = [...cards].sort(sorters[sortKey]).map(c => `
    <button class="tile" data-id="${c.card_id}">
      <img src="${c.image_url}" alt="${c.name} card" loading="lazy">
      <div class="name">${c.name}</div>
      <div class="sub">${c.rarity ?? "—"} · #${c.number}</div>
      <div class="prices">
        <span class="now mono">${usd(c.current_price)}</span>
        ${chg(c.pct_change)}
      </div>
      <div class="was mono">7d ago: ${usd(c.price_7d_ago)}</div>
    </button>`).join("");
}

async function load() {
  try {
    const res = await fetch("data/trending.json", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    cards = data.cards;
    if (!cards.length) throw new Error("empty");
    document.getElementById("meta").textContent =
      `${cards.length} cards · snapshot ${data.latest_snapshot}`;
    render("number");
  } catch (e) {
    document.getElementById("empty").hidden = false;
  }
}

document.getElementById("sort").addEventListener("change", e => render(e.target.value));
document.getElementById("grid").addEventListener("click", e => {
  const tile = e.target.closest(".tile");
  if (tile) openCard(tile.dataset.id);
});
document.getElementById("close").addEventListener("click", () => modal.close());
modal.addEventListener("click", e => { if (e.target === modal) modal.close(); });

load();
</script>
</body>
</html>
